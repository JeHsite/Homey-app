<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@400;500;600;700&family=Quicksand:wght@500;600&display=swap');
  body { margin: 0; }
  .ent-root {
    --navy: #0A0D13; --navy-panel: #10141D; --navy-panel-2: #151A24;
    --bronze: #CBA05A; --cyan: #4FD8FF; --line: rgba(203, 160, 90, 0.16);
    background: var(--navy); color: #E7E9EE; font-family: 'Assistant', sans-serif;
  }
  .ent-root h1, .ent-root h2, .ent-root h3, .ent-root .ent-heading { font-family: 'Rubik', sans-serif; }
  .homey-word { font-family: 'Quicksand', sans-serif; font-weight: 600; }
  .ent-header { background: rgba(10, 13, 19, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .ent-horizon { height: 2px; width: 100%; background: linear-gradient(90deg, var(--cyan), var(--bronze), var(--cyan)); background-size: 200% 100%; animation: ent-horizon-move 6s linear infinite; }
  @keyframes ent-horizon-move { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }
  .ent-status-pill { background: rgba(79, 216, 255, 0.1); border: 1px solid rgba(79, 216, 255, 0.35); color: var(--cyan); }
  .ent-nav-btn { color: #9AA1AF; transition: all .2s ease; }
  .ent-nav-btn:hover { background: var(--navy-panel-2); color: #E7E9EE; }
  .ent-nav-btn.active { background: linear-gradient(135deg, rgba(203,160,90,0.18), rgba(79,216,255,0.12)); color: var(--bronze); border: 1px solid rgba(203,160,90,0.35); }
  .ent-card { background: var(--navy-panel); border: 1px solid var(--line); border-radius: 20px; }
  .ent-pill-btn { border-radius: 999px; font-family: 'Rubik', sans-serif; font-weight: 600; transition: all .15s ease; }
  .ent-pill-btn.solid-bronze { background: var(--bronze); color: #0A0D13; }
  .ent-pill-btn.solid-bronze:hover { background: #DBB06A; transform: translateY(-1px); }
  .ent-pill-btn.ghost { background: transparent; border: 1px solid var(--line); color: #C7CAD3; }
  .ent-pill-btn.ghost:hover { background: var(--navy-panel-2); }
  .ent-row { border-bottom: 1px solid var(--line); }
  .ent-row:last-child { border-bottom: none; }
  .ent-chip-paid { background: rgba(79, 216, 255, 0.12); color: var(--cyan); cursor: pointer; }
  .ent-chip-due { background: rgba(203, 160, 90, 0.16); color: var(--bronze); cursor: pointer; }
  .ent-note-card { background: rgba(203, 160, 90, 0.08); border: 1px solid rgba(203, 160, 90, 0.25); }
  .ent-trip-card { background: rgba(79, 216, 255, 0.06); border: 1px solid rgba(79, 216, 255, 0.22); }
  .ent-input { background: var(--navy-panel-2); border: 1px solid var(--line); color: #E7E9EE; }
  .ent-input:focus { border-color: var(--cyan); outline: none; }
  .ent-input::placeholder { color: #6B7280; }
  .ent-icon-btn { color: #6B7280; transition: color .15s ease; }
  .ent-icon-btn:hover { color: #FF7A7A; }
  .ent-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy-panel); border: 1px solid rgba(79,216,255,0.4); color: #E7E9EE; padding: 10px 20px; border-radius: 999px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100; animation: ent-toast-in .2s ease; }
  @keyframes ent-toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .ent-empty { color: #6B7280; }
  .ent-table th { text-align: right; padding: 10px 12px; font-size: 12px; color: #9AA1AF; font-weight: 600; border-bottom: 1px solid var(--line); }
  .ent-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .ent-table tr.cat-row td { font-weight: 700; background: rgba(203,160,90,0.06); }
  .ent-table tr.total-row td { font-weight: 800; border-top: 2px solid var(--bronze); border-bottom: none; }
  .ent-mini-card { background: var(--navy-panel-2); border: 1px solid var(--line); border-radius: 16px; }
  .ent-locked { display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 60px 20px; color:#6B7280; }
  .ent-progress-track { background: var(--navy-panel-2); border-radius: 999px; height: 10px; overflow: hidden; }
  .ent-progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--cyan), var(--bronze)); }
</style>

}

function DonutChart({ data }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let cumulative = 0;
  const segments = data.map((d, i) => {
    const pct = (d.value / total) * 100;
    const seg = { ...d, pct, offset: -cumulative, color: CHART_COLORS[i % CHART_COLORS.length] };
    cumulative += pct;
    return seg;
  });
  return (
    <div className="flex items-center gap-6 flex-wrap">
      <svg width="150" height="150" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="15.9" fill="transparent" stroke="#151A24" strokeWidth="6" />
        {segments.map(s => <circle key={s.name} cx="21" cy="21" r="15.9" fill="transparent" stroke={s.color} strokeWidth="6" strokeDasharray={`${s.pct} ${100 - s.pct}`} strokeDashoffset={s.offset} />)}
      </svg>
      <div>{segments.map(s => (
        <div key={s.name} className="flex items-center gap-2 text-xs mb-1.5" style={{ color: '#C7CAD3' }}>
          <span className="w-2.5 h-2.5 rounded-sm" style={{ background: s.color }}></span><span>{s.name}</span><span style={{ color: '#6B7280' }}>₪{s.value.toLocaleString()}</span>
        </div>
      ))}</div>
    </div>
  );
}

function TrendBars({ data }) {
  const max = Math.max(1, ...data.map(d => Math.max(d.income, d.expense)));
  return (
    <div className="flex items-end gap-5 h-48 px-2">
      {data.map(d => (
        <div key={d.month} className="flex flex-col items-center gap-1.5 flex-1">
          <div className="flex items-end gap-1" style={{ height: '150px' }}>
            <div style={{ width: 16, height: `${(d.income / max) * 150}px`, background: 'var(--cyan)', borderRadius: '4px 4px 0 0' }}></div>
            <div style={{ width: 16, height: `${(d.expense / max) * 150}px`, background: 'var(--bronze)', borderRadius: '4px 4px 0 0' }}></div>
          </div>
          <span className="text-xs" style={{ color: '#9AA1AF' }}>{d.month}</span>

      ))}
    </div>
  );
}

function generateFamilyCode(name) {
  const letters = (name || '').replace(/[^a-zA-Z]/g, '').toUpperCase();
  let prefix;
  if (letters.length >= 2) prefix = letters.slice(0, 2);
  else {
    const pool = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    prefix = pool[Math.floor(Math.random() * pool.length)] + pool[Math.floor(Math.random() * pool.length)];
  }
  const digits = String(Math.floor(10 + Math.random() * 90));
  return prefix + digits;
}

                  </div>
                )}
                {assets.length === 0 ? <EmptyState text="אין נכסים רשומים עדיין" /> : (<div>{assets.map(a => (<div key={a.id} className="ent-row py-3 flex justify-between items-center group"><div className="flex items-center gap-2"><span>{ASSET_TYPES[a.type]}</span><div><p className="font-semibold text-sm">{a.name}</p><p className="text-xs" style={{ color: '#9AA1AF' }}>{a.type}</p></div></div><div className="flex items-center gap-3"><span className="font-bold" style={{ color: '#8BD8A0' }}>₪{a.value.toLocaleString()}</span><button className="ent-icon-btn opacity-0 group-hover:opacity-100" onClick={() => { setAssets(prev => prev.filter(x => x.id !== a.id)); showToast('הנכס נמחק'); }}><ITrash size={16} /></button></div></div>))}</div>)}
              </div>
              {assets.length > 0 && (<div className="ent-card p-6"><h3 className="ent-heading font-bold mb-3">התפלגות תיק הנכסים · סה"כ ₪{totalAssets.toLocaleString()}</h3><DonutChart data={assetBreakdown} /></div>)}
            </div>
          )}

          {activeTab === 'notes' && (
            <div className="ent-card p-6 space-y-4">
              <div className="flex items-center justify-between"><h2 className="ent-heading text-xl font-bold">פתקים משפחתיים</h2><button onClick={() => setOpenForm(openForm === 'notes' ? null : 'notes')} className="ent-pill-btn solid-bronze flex items-center gap-1.5 px-4 py-2 text-sm"><IPlus size={16} /> הוסף פתק</button></div>
              {openForm === 'notes' && (<div className="grid grid-cols-1 gap-3 p-4 rounded-xl" style={{ background: 'var(--navy-panel-2)' }}><input className={inputClass} placeholder="כותרת" value={formData.notes.title} onChange={e => updateField('notes', 'title', e.target.value)} /><input className={inputClass} placeholder="תוכן" value={formData.notes.content} onChange={e => updateField('notes', 'content', e.target.value)} /><div className="flex gap-2"><button onClick={submitNote} className="ent-pill-btn solid-bronze px-5 py-2 text-sm">שמור</button><button onClick={() => closeForm('notes')} className="ent-pill-btn ghost px-5 py-2 text-sm">ביטול</button></div></div>)}
              {notes.length === 0 ? <EmptyState text="אין פתקים עדיין" /> : (<div className="grid grid-cols-1 sm:grid-cols-2 gap-4">{[...notes].sort((a, b) => b.isPinned - a.isPinned).map(n => (<div key={n.id} className="ent-note-card p-4 rounded-xl relative group"><div className="flex items-start justify-between"><h3 className="ent-heading font-bold" style={{ color: 'var(--bronze)' }}>{n.title}</h3><div className="flex items-center gap-2"><button onClick={() => setNotes(prev => prev.map(x => x.id === n.id ? { ...x, isPinned: !x.isPinned } : x))}><IPin size={15} style={{ color: n.isPinned ? 'var(--bronze)' : '#6B7280' }} filled={n.isPinned} /></button><button className="ent-icon-btn opacity-0 group-hover:opacity-100" onClick={() => { setNotes(prev => prev.filter(x => x.id !== n.id)); showToast('הפתק נמחק'); }}><ITrash size={15} /></button></div></div><p className="text-sm mt-1" style={{ color: '#C7CAD3' }}>{n.content}</p></div>))}</div>)}
            </div>
          )}

          {activeTab === 'trips' && (
            <div className="ent-card p-6 space-y-4">
              <div className="flex items-center justify-between"><h2 className="ent-heading text-xl font-bold">טיולים וחופשות</h2>{!isChild && <button onClick={() => setOpenForm(openForm === 'trips' ? null : 'trips')} className="ent-pill-btn solid-bronze flex items-center gap-1.5 px-4 py-2 text-sm"><IPlus size={16} /> הוסף טיול</button>}</div>
              {openForm === 'trips' && !isChild && (<div className="grid grid-cols-1 sm:grid-cols-2 gap-3 p-4 rounded-xl" style={{ background: 'var(--navy-panel-2)' }}><input className={inputClass} placeholder="שם הטיול" value={formData.trips.title} onChange={e => updateField('trips', 'title', e.target.value)} /><select className={inputClass} value={formData.trips.type} onChange={e => updateField('trips', 'type', e.target.value)}>{Object.keys(TRIP_TYPES).map(t => <option key={t} value={t}>{t}</option>)}</select><input className={inputClass} type="number" placeholder="תקציב ₪" value={formData.trips.budget} onChange={e => updateField('trips', 'budget', e.target.value)} /><input className={inputClass} type="date" value={formData.trips.startDate} onChange={e => updateField('trips', 'startDate', e.target.value)} /><input className={inputClass} type="date" value={formData.trips.endDate} onChange={e => updateField('trips', 'endDate', e.target.value)} /><div className="flex gap-2 sm:col-span-2"><button onClick={submitTrip} className="ent-pill-btn solid-bronze px-5 py-2 text-sm">שמור</button><button onClick={() => closeForm('trips')} className="ent-pill-btn ghost px-5 py-2 text-sm">ביטול</button></div></div>)}
              {trips.length === 0 ? <EmptyState text="לא תוכננו טיולים עדיין" /> : (trips.map(tr => (<div key={tr.id} className="ent-trip-card p-4 rounded-xl flex justify-between items-center group"><div className="flex items-center gap-3"><span className="text-lg">{TRIP_TYPES[tr.type]}</span><div><h3 className="ent-heading font-bold" style={{ color: 'var(--cyan)' }}>{tr.title}</h3><p className="text-xs" style={{ color: '#9AA1AF' }}>{tr.type} • {tr.startDate} עד {tr.endDate || '—'}</p></div></div><div className="flex items-center gap-3"><span className="font-bold" style={{ color: 'var(--cyan)' }}>תקציב: ₪{tr.budget}</span>{!isChild && <button className="ent-icon-btn opacity-0 group-hover:opacity-100" onClick={() => { setTrips(prev => prev.filter(x => x.id !== tr.id)); showToast('הטיול נמחק'); }}><ITrash size={16} /></button>}</div></div>)))}
            </div>
          )}

          {activeTab === 'gifts' && (
            <div className="ent-card p-6 space-y-4">
              <div className="flex items-center justify-between"><h2 className="ent-heading text-xl font-bold">מתנות ואירועים</h2>{!isChild && <button onClick={() => setOpenForm(openForm === 'gifts' ? null : 'gifts')} className="ent-pill-btn solid-bronze flex items-center gap-1.5 px-4 py-2 text-sm"><IPlus size={16} /> הוסף אירוע</button>}</div>
              {openForm === 'gifts' && !isChild && (<div className="grid grid-cols-1 sm:grid-cols-2 gap-3 p-4 rounded-xl" style={{ background: 'var(--navy-panel-2)' }}><input className={inputClass} placeholder="שם האירוע" value={formData.gifts.event} onChange={e => updateField('gifts', 'event', e.target.value)} /><select className={inputClass} value={formData.gifts.category} onChange={e => updateField('gifts', 'category', e.target.value)}>{Object.keys(GIFT_CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}</select><input className={inputClass} type="date" value={formData.gifts.date} onChange={e => updateField('gifts', 'date', e.target.value)} /><input className={inputClass} type="number" placeholder="תקציב ₪" value={formData.gifts.budget} onChange={e => updateField('gifts', 'budget', e.target.value)} /><input className={inputClass} placeholder="רעיון למתנה" value={formData.gifts.idea} onChange={e => updateField('gifts', 'idea', e.target.value)} /><div className="flex gap-2 sm:col-span-2"><button onClick={submitGift} className="ent-pill-btn solid-bronze px-5 py-2 text-sm">שמור</button><button onClick={() => closeForm('gifts')} className="ent-pill-btn ghost px-5 py-2 text-sm">ביטול</button></div></div>)}
              {gifts.length === 0 ? <EmptyState text="אין אירועים קרובים" /> : (gifts.map(g => (<div key={g.id} className="flex justify-between items-center p-3 rounded-xl group" style={{ background: 'var(--navy-panel-2)' }}><div className="flex items-center gap-3"><button onClick={() => setGifts(prev => prev.map(x => x.id === g.id ? { ...x, purchased: !x.purchased } : x))} className="w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0" style={{ border: `1px solid ${g.purchased ? 'var(--cyan)' : '#6B7280'}`, background: g.purchased ? 'var(--cyan)' : 'transparent' }}>{g.purchased && <ICheck size={13} style={{ color: '#0A0D13' }} />}</button><span className="text-lg">{GIFT_CATEGORIES[g.category]}</span><div><p className="font-semibold" style={{ textDecoration: g.purchased ? 'line-through' : 'none', color: g.purchased ? '#6B7280' : '#E7E9EE' }}>{g.event}</p><p className="text-xs" style={{ color: '#9AA1AF' }}>{g.category} • רעיון: {g.idea || '—'} • תאריך: {g.date || '—'}</p></div></div><div className="flex items-center gap-3"><span className="font-bold" style={{ color: 'var(--bronze)' }}>₪{g.budget}</span>{!isChild && <button className="ent-icon-btn opacity-0 group-hover:opacity-100" onClick={() => { setGifts(prev => prev.filter(x => x.id !== g.id)); showToast('האירוע נמחק'); }}><ITrash size={16} /></button>}</div></div>)))}
            </div>
          )}
        </main>
      </div>
      {toast && <div className="ent-toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
