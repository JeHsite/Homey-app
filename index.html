<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homey</title>
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Homey" />
<meta name="theme-color" content="#0A0D13" />

<script>
// Homey — פוש. המפתח הציבורי של VAPID (לא סודי; הפרטי שמור רק ב-Supabase Secrets).
const HOMEY_VAPID_PUBLIC = 'BFntzjEGl5UcUKAnXpydoI164XoQUcBGy_DpO4FdxjAMDcOnGWm_oqe0R23icPqEspls1KIJ0FWBmkqkwH1EKN4';
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.homeyPush = {
  supported() {
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  },
  needsIosInstall() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    return ios && !standalone;
  },
  async current() {
    if (!this.supported()) return null;
    const reg = await navigator.serviceWorker.getRegistration();
    return reg ? reg.pushManager.getSubscription() : null;
  },
  async enable(sb, familyId) {
    // requestPermission חייב לרוץ ראשון, ישירות מתוך הלחיצה (אחרת ספארי חוסם)
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('denied');
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const b64 = HOMEY_VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0))
      });
    }
    const j = sub.toJSON();
    const { data: { session } } = await sb.auth.getSession();
    const { error } = await sb.from('push_subscriptions').upsert({
      family_id: familyId,
      user_id: session.user.id,
      endpoint: j.endpoint,
      p256dh: j.keys.p256dh,
      auth: j.keys.auth
    }, { onConflict: 'endpoint' });
    if (error) throw error;
  },
  async disable(sb) {
    const sub = await this.current();
    if (!sub) return;
    await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    await sub.unsubscribe();
  }
};
</script>

}

body[data-theme="sunset"] .ent-root, body[data-theme="sunset"] {
  --navy: #150F14; --navy-panel: #1E1519; --navy-panel-2: #271B21;

}

body[data-theme="forest"] .ent-root, body[data-theme="forest"] {
  --navy: #0C1410; --navy-panel: #131E18; --navy-panel-2: #1A2820;

}

  --navy: #0D0D0D; --navy-panel: #161616; --navy-panel-2: #1F1F1F;
  --bronze: #BFBFBF; --cyan: #8A8A8A; --line: rgba(255, 255, 255, 0.12);
  --text: #F0F0F0; --text-2: #C8C8C8; --text-muted: #909090; --text-dim: #666666;
  --on-accent: #0D0D0D;
  --pos: #DCDCDC; --pos-soft: #B4B4B4; --neg: #8C8C8C; --neg-soft: #7A7A7A;
}

body { background: var(--navy); transition: background .25s ease; }

/* light-theme readability tweaks */
body[data-theme="light"] .ent-header { background: rgba(255,255,255,0.92); }
body[data-theme="light"] .ent-toast { box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
body[data-theme="light"] .ent-note-card { background: rgba(184,134,59,0.08); border-color: rgba(184,134,59,0.3); }

body[data-theme="light"] .ent-card { box-shadow: 0 1px 3px rgba(16,32,46,0.06); }

body[data-compact="1"] .ent-card { padding: 1rem !important; border-radius: 14px; }
body[data-compact="1"] .ent-mini-card { padding: 0.65rem !important; }
body[data-compact="1"] .ent-row { padding-top: .4rem !important; padding-bottom: .4rem !important; }
body[data-compact="1"] .ent-table td { padding: 6px 10px; }
body[data-compact="1"] main { gap: .75rem; }
